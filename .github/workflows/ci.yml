name: Checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
        psr: ['^2.0']
        include:
          - php: '8.1'
            psr: '^1.0'
    name: PHP ${{ matrix.php }} / PSR HTTP ${{ matrix.psr }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, mbstring, xml, xmlwriter
          coverage: none
          tools: composer:v2
      - name: Select supported HTTP interfaces
        run: composer require --no-update --no-interaction "psr/http-message:${{ matrix.psr }}"
      - name: Install development dependencies
        run: composer update --no-interaction --prefer-dist
      - name: Validate, test, and analyse
        run: composer check
